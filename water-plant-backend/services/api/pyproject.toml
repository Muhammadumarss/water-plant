[project]
name = "water-plant-api"
version = "0.1.0"
description = "Water Plant Management System - API-first modular monolith"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2.7,<5.3",
    "djangorestframework>=3.16,<3.17",
    "djangorestframework-simplejwt>=5.5,<6",
    "drf-spectacular>=0.28,<0.30",
    "psycopg[binary]>=3.2,<4",
    "celery>=5.5,<5.7",
    "redis>=5.2,<7",
    "gunicorn>=23",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["**/migrations/*"]
cache-dir = "../../.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B904"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405"]
